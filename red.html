<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 青山实中论坛</title>
<style>
  :root{
    color-scheme:dark;

    --red-900:#0a0101;
    --red-800:#1a0404;
    --red-700:#e04444;
    --red-600:#a81818;
    --red-500:#c81e1e;
    --red-100:#3a0a0a;
    --red-50:#1a0404;

    --ink:#d8c5c5;
    --muted:#8a6060;
    --line:#2e0a0a;
    --bg:#080101;
    --card:#140303;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.65), 0 10px 30px -14px rgba(200,30,30,.35);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(120,10,10,.35), transparent 70%),
      radial-gradient(900px 500px at 80% 110%, rgba(80,5,5,.28), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:radial-gradient(rgba(200,30,30,.05) 1px, transparent 1px);
    background-size:3px 3px;
    opacity:.6;
    mix-blend-mode:screen;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input{font-family:inherit;font-size:inherit;outline:none}
  mark{background:#4a0808;color:#ff9a9a;padding:0 2px;border-radius:3px}

  .container{max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:2}

  /* ============ 顶部导航 ============ */
  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,2,2,.9);
    backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(200,30,30,.15), 0 12px 30px -22px rgba(200,30,30,.7);
  }
  .site-header::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(200,30,30,.65),transparent);
    animation:headerPulse 4s ease-in-out infinite;
  }
  @keyframes headerPulse{
    0%,100%{opacity:.25}
    50%{opacity:.9}
  }
  .header-inner{
    display:flex;align-items:center;gap:20px;height:64px;
  }
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo-mark{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(140deg,var(--red-500),#4a0c0c);
    display:grid;place-items:center;color:#ffd7d7;
    box-shadow:0 6px 18px -6px rgba(200,30,30,.85), inset 0 0 12px rgba(0,0,0,.5);
  }
  .logo-text{font-size:18px;font-weight:700;letter-spacing:.4px;white-space:nowrap;color:#f0dada}
  .logo-text small{display:block;font-size:10px;font-weight:500;color:#9a5858;letter-spacing:1.6px}

  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;
    transition:.2s;white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(140deg,var(--red-500),#5c0c0c);
    color:#fff2f2;
    border:1px solid rgba(200,30,30,.5);
    box-shadow:0 8px 22px -10px rgba(200,30,30,.9), inset 0 1px 0 rgba(255,150,150,.15);
  }
  .btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}

  /* ============ 用户信息卡 ============ */
  .user-card{
    margin-top:28px;
    background:
      radial-gradient(600px 200px at 20% -30%, rgba(200,30,30,.28), transparent 65%),
      linear-gradient(135deg,#1a0404,#0d0202);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 30px;
    display:flex;align-items:center;gap:22px;
    box-shadow:var(--shadow), inset 0 0 40px rgba(200,30,30,.06);
    position:relative;
    overflow:hidden;
  }
  .user-card::after{
    content:"";
    position:absolute;right:-80px;top:-80px;
    width:240px;height:240px;border-radius:50%;
    border:1px solid rgba(200,30,30,.15);
    pointer-events:none;
  }
  .user-avatar-large{
    width:84px;height:84px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #3a0a0a, #120202 75%);
    border:2px solid #4a0c0c;
    display:grid;place-items:center;color:#c81e1e;
    box-shadow:0 0 24px -4px rgba(200,30,30,.6), inset 0 0 20px rgba(200,30,30,.2);
    position:relative;
  }
  .user-avatar-large svg{width:48px;height:48px;display:block}
  .user-avatar-large::after{
    content:"";
    position:absolute;right:2px;bottom:2px;
    width:16px;height:16px;border-radius:50%;
    background:#e04444;
    border:3px solid #0a0202;
    box-shadow:0 0 12px #c81e1e;
    animation:avatarPulse 2.2s ease-in-out infinite;
  }
  @keyframes avatarPulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.85)}
  }

  .user-info{flex:1;min-width:0}
  .user-info h1{
    font-size:24px;color:#f5e0e0;letter-spacing:.5px;
    text-shadow:0 0 18px rgba(200,30,30,.4);
    margin-bottom:4px;
  }
  .user-info .handle{
    font-size:13.5px;color:#8a6060;letter-spacing:.3px;
    margin-bottom:14px;
  }
  .user-info .handle b{color:#a88888;font-weight:600}

  .user-stats{display:flex;gap:22px;flex-wrap:wrap}
  .user-stats .stat{
    font-size:12px;color:#7a5050;letter-spacing:.5px;
  }
  .user-stats .stat b{
    display:block;
    font-size:19px;color:#ff9a9a;font-weight:700;
    margin-bottom:2px;
    font-family:Consolas,monospace;
    text-shadow:0 0 14px rgba(200,30,30,.5);
  }

  /* ============ 区块标题 ============ */
  .section-head{
    margin-top:34px;margin-bottom:16px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .section-head h2{
    font-size:17px;letter-spacing:.5px;color:#f0dada;
    display:flex;align-items:center;gap:10px;
  }
  .section-head h2::before{
    content:"";width:3px;height:16px;border-radius:2px;
    background:linear-gradient(var(--red-500),#4a0c0c);
    box-shadow:0 0 8px rgba(200,30,30,.7);
  }
  .section-head .hint{
    font-size:12px;color:#7a3a3a;letter-spacing:.6px;
  }

  /* ============ 私密帖列表 ============ */
  .private-posts{
    display:flex;flex-direction:column;gap:14px;
  }
  .private-post{
    display:flex;gap:16px;align-items:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    cursor:pointer;
    transition:.2s;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .private-post::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,rgba(200,30,30,.7),transparent);
    opacity:.5;
  }
  .private-post:hover{
    border-color:rgba(200,30,30,.5);
    box-shadow:0 0 24px -6px rgba(200,30,30,.65), inset 0 0 30px rgba(200,30,30,.06);
    transform:translateX(2px);
  }
  .private-post-lock{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    display:grid;place-items:center;
    background:radial-gradient(circle at 32% 28%, #3a0a0a, #120202 75%);
    border:1px solid #4a0c0c;
    color:#c81e1e;
    box-shadow:0 0 14px -4px rgba(200,30,30,.5);
  }
  .private-post-lock svg{width:22px;height:22px;display:block}
  .private-post-main{flex:1;min-width:0}
  .private-post-title{
    font-size:17px;font-weight:600;color:#e8d5d5;
    margin-bottom:8px;
    letter-spacing:.3px;
    word-break:break-word;
    transition:.2s;
  }
  .private-post:hover .private-post-title{color:#ff9a9a}
  .private-post-meta{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);
  }
  .private-post-meta .cat{
    color:#ffb3b3;background:var(--red-50);
    padding:2px 9px;border-radius:6px;font-weight:600;
    border:1px solid rgba(200,30,30,.18);
  }
  .private-post-meta .replies{
    color:#ff8080;
    font-weight:600;
  }
  .private-post-arrow{
    color:#5a2525;
    font-size:18px;line-height:1;
    flex-shrink:0;
    transition:.2s;
  }
  .private-post:hover .private-post-arrow{
    color:#ff6666;
    transform:translateX(3px);
  }

  /* ============ 详情视图 ============ */
  .private-detail{display:none}
  .private-detail.show{display:block}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:#a88888;
    padding:7px 14px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);
    transition:.18s;
    margin-top:24px;margin-bottom:16px;
  }
  .back-btn:hover{
    color:#ffb3b3;
    border-color:var(--red-500);
    transform:translateX(-2px);
  }

  .detail-inner{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px;
    box-shadow:var(--shadow);
  }

  .detail-head{
    display:flex;gap:14px;align-items:flex-start;
    padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px;
  }
  .detail-head .avatar{
    width:48px;height:48px;border-radius:14px;font-size:18px;
    background:radial-gradient(circle at 32% 28%, #3a0a0a, #120202 75%);
    border:1px solid #4a0c0c;
    display:grid;place-items:center;color:#c81e1e;
    flex-shrink:0;
  }
  .detail-head .avatar svg{width:26px;height:26px}
  .detail-head .dh-main{flex:1;min-width:0}
  .detail-title{
    font-size:23px;line-height:1.45;color:#f5e0e0;margin-bottom:9px;
    text-shadow:0 0 18px rgba(200,30,30,.3);
  }
  .detail-head .post-meta{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);
  }
  .detail-head .post-meta .cat{
    color:#ffb3b3;background:var(--red-50);
    padding:2px 9px;border-radius:6px;font-weight:600;
    border:1px solid rgba(200,30,30,.18);
  }

  /* ============ 楼层 ============ */
  .floor-list{margin-top:6px}
  .floor-list-title{
    font-size:13px;color:var(--muted);margin:4px 0 4px;
    display:flex;align-items:center;gap:7px;
  }
  .floor-list-title::before{
    content:"";width:3px;height:13px;border-radius:2px;
    background:linear-gradient(var(--red-500),#4a0c0c);
    box-shadow:0 0 8px rgba(200,30,30,.7);
  }
  .floor{
    padding:15px 0;border-bottom:1px dashed var(--line);
  }
  .floor:last-child{border-bottom:none}
  .floor-head{
    display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12.5px;
  }
  .floor-no{
    font-weight:700;color:#ffb3b3;background:var(--red-50);
    padding:1px 8px;border-radius:6px;font-size:12px;
    border:1px solid rgba(200,30,30,.2);
  }
  .floor-author{font-weight:600;color:#d8b5b5}
  .floor-tag{
    font-size:10.5px;font-weight:700;color:#fff2f2;
    background:linear-gradient(140deg,var(--red-500),#5c0c0c);
    padding:1px 7px;border-radius:6px;
    box-shadow:0 0 10px -2px rgba(200,30,30,.8);
  }
  .floor-content{
    font-size:14px;color:#c9b3b3;line-height:1.9;
    white-space:pre-line;
    word-break:break-word;
  }
  .floor-content strong{
    font-weight:700;
    color:#ff9a9a;
    text-shadow:0 0 10px rgba(200,30,30,.5);
  }

  /* ============ 抖动效果（保留） ============ */
  .shake-content{
    display:inline-block;
    color:#ff5555 !important;
    text-shadow:
      0 0 8px rgba(255,60,60,.9),
      0 0 18px rgba(255,30,30,.6),
      0 0 32px rgba(200,20,20,.45) !important;
    animation:floorShake .28s infinite;
    transform-origin:left center;
    will-change:transform;
  }
  @keyframes floorShake{
    0%   {transform:translate(0,0) rotate(0deg);opacity:1}
    10%  {transform:translate(-1.6px,-1px) rotate(-.35deg);opacity:.92}
    20%  {transform:translate(1.6px,.6px) rotate(.35deg);opacity:1}
    30%  {transform:translate(-1px,1.6px) rotate(-.25deg);opacity:.85}
    40%  {transform:translate(1.6px,-1px) rotate(.25deg);opacity:1}
    50%  {transform:translate(-1.6px,.6px) rotate(-.35deg);opacity:.9}
    60%  {transform:translate(1px,1.6px) rotate(.35deg);opacity:1}
    70%  {transform:translate(-1px,-1.6px) rotate(-.25deg);opacity:.88}
    80%  {transform:translate(1.6px,1px) rotate(.25deg);opacity:1}
    90%  {transform:translate(-1.6px,-.6px) rotate(-.35deg);opacity:.93}
    100% {transform:translate(0,0) rotate(0deg);opacity:1}
  }

  .floor-image{
    margin-top:10px;
    max-width:260px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#1a0404;
  }
  .floor-image img{
    display:block;
    width:100%;
    height:auto;
    filter:saturate(.85) contrast(1.05) hue-rotate(-10deg);
  }

  .detail-foot{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);
  }

  /* ============ 选择按钮（保留） ============ */
  .private-choice-wrap{
    margin-top:34px;
    padding-top:26px;
    border-top:1px dashed var(--line);
    text-align:center;
  }
  .choice-btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:15px 44px;
    font-size:16px;font-weight:700;letter-spacing:3px;
    color:#fff5f5;
    background:linear-gradient(140deg,#e01a1a,#8a0c0c 55%,#3a0404);
    border:1px solid rgba(255,120,120,.5);
    border-radius:12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    text-shadow:0 0 12px rgba(255,80,80,.9);
    box-shadow:
      0 10px 30px -10px rgba(220,20,20,.95),
      0 0 0 1px rgba(0,0,0,.4) inset,
      inset 0 0 30px rgba(0,0,0,.4);
    animation:choicePulse 2.4s ease-in-out infinite;
    transition:filter .2s, transform .15s;
  }
  .choice-btn::before{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(200px 60px at 50% 0%, rgba(255,180,180,.35), transparent 70%);
    pointer-events:none;
  }
  .choice-btn::after{
    content:"";
    position:absolute;
    top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,200,200,.28), transparent);
    transform:skewX(-18deg);
    animation:choiceSweep 3s ease-in-out infinite;
  }
  @keyframes choicePulse{
    0%,100%{
      box-shadow:
        0 10px 30px -10px rgba(220,20,20,.85),
        0 0 0 1px rgba(0,0,0,.4) inset,
        inset 0 0 30px rgba(0,0,0,.4);
    }
    50%{
      box-shadow:
        0 14px 42px -8px rgba(255,40,40,1),
        0 0 28px rgba(220,20,20,.7),
        0 0 0 1px rgba(0,0,0,.4) inset,
        inset 0 0 30px rgba(0,0,0,.4);
    }
  }
  @keyframes choiceSweep{
    0%{left:-120%}
    55%{left:140%}
    100%{left:140%}
  }
  .choice-btn:hover{
    filter:brightness(1.15);
    transform:translateY(-1px);
  }
  .choice-btn:active{transform:translateY(0) scale(.99)}

  .choice-hint{
    margin-top:12px;
    font-size:11.5px;
    color:#7a3a3a;
    letter-spacing:4px;
    animation:choiceHintBlink 3s ease-in-out infinite;
  }
  @keyframes choiceHintBlink{
    0%,100%{opacity:.35}
    50%{opacity:.9}
  }

  /* ============ 页脚 ============ */
  .site-footer{
    border-top:1px solid var(--line);
    background:#0a0101;
    padding:26px 0;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:50px;
    position:relative;z-index:2;
  }

  /* ============ 响应式 ============ */
  @media (max-width:640px){
    .header-inner{height:60px;gap:10px}
    .logo-text small{display:none}
    .btn{padding:8px 14px;font-size:13.5px}

    .user-card{padding:22px 20px;gap:16px;flex-wrap:wrap;border-radius:14px}
    .user-avatar-large{width:66px;height:66px}
    .user-avatar-large svg{width:38px;height:38px}
    .user-info h1{font-size:20px}
    .user-stats{gap:16px}
    .user-stats .stat b{font-size:16px}

    .private-post{padding:16px 16px;gap:12px}
    .private-post-lock{width:40px;height:40px;border-radius:10px}
    .private-post-lock svg{width:19px;height:19px}
    .private-post-title{font-size:15.5px}

    .detail-inner{padding:20px}
    .detail-title{font-size:19px}
    .floor-content{font-size:13.5px}

    .choice-btn{font-size:14px;padding:13px 30px;letter-spacing:2px}
    .choice-hint{font-size:10.5px;letter-spacing:3px}
  }

  @media (max-width:480px){
    .logo-text{display:none}
    .logo-mark{width:34px;height:34px;border-radius:10px}
    .container{padding:0 14px}
    .private-post{padding:14px}
    .private-post-title{font-size:14.5px}
    .private-post-meta{gap:8px;font-size:11px}
  }
</style>
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header class="site-header">
  <div class="container header-inner">
    <a href="https://qsszlt.pages.dev" class="logo">
      <span class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20l6.2-10.5 4 6.2 2.8-4 5 8.3z"/>
          <circle cx="17.5" cy="6.5" r="2.2"/>
        </svg>
      </span>
      <span class="logo-text">青山实中论坛<small>个人中心 · PERSONAL</small></span>
    </a>

    <div class="header-right">
      <a href="https://qsszlt.pages.dev" class="btn btn-primary">返回论坛</a>
    </div>
  </div>
</header>

<!-- ================= 主内容 ================= -->
<main class="container" id="mainView">

  <!-- 用户信息卡 -->
  <div class="user-card">
    <div class="user-avatar-large">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="user-info">
      <h1>林圻</h1>
      <div class="handle">账号 <b>@linqi</b> · 高二（7）班</div>
      <div class="user-stats">
        <div class="stat"><b>2</b>私密帖</div>
        <div class="stat"><b>0</b>公开帖</div>
        <div class="stat"><b>刚刚</b>最近活跃</div>
      </div>
    </div>
  </div>

  <!-- 私密帖列表 -->
  <div class="section-head">
    <h2>我的私密帖子</h2>
    <span class="hint">仅自己可见 · 共 2 篇</span>
  </div>
  <div class="private-posts" id="privatePosts"></div>

</main>

<!-- ================= 详情视图 ================= -->
<main class="container private-detail" id="detailView">
  <button class="back-btn" id="backToList">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    返回列表
  </button>

  <div class="detail-inner" id="detailContent"></div>
</main>

<!-- ================= 页脚 ================= -->
<footer class="site-footer">
  <div class="container">
    © 2025 青山实中论坛 · 个人中心 · 用心交流，共同成长
  </div>
</footer>

<script>
/* ================= 私密帖数据 ================= */
const privatePosts = [
  {
    id: 'private-1',

/* ================= 工具函数 ================= */
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

function renderFloors(p){
  if (!p.floors || !p.floors.length) return '';

  const items = p.floors.map(f => {
    const contentClass = f.shake ? 'floor-content shake-content' : 'floor-content';
    const contentHTML = escapeHTML(f.content);

    return `
      <div class="floor">
        <div class="floor-head">
          <span class="floor-no">${f.no}F</span>
          <span class="floor-author">${escapeHTML(f.author)}</span>
          <span class="floor-tag">楼主</span>
        </div>
        <div class="${contentClass}">${contentHTML}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="floor-list">
      <div class="floor-list-title">全部回复（${p.floors.length}）</div>
      ${items}
    </div>
  `;
}

/* ================= 渲染私密帖列表 ================= */
const listView = document.getElementById('mainView');
const detailView = document.getElementById('detailView');
const privatePostsEl = document.getElementById('privatePosts');
const detailContent = document.getElementById('detailContent');
const backToList = document.getElementById('backToList');

function renderList(){
  privatePostsEl.innerHTML = privatePosts.map(p => `
    <article class="private-post" data-pid="${p.id}">
      <div class="private-post-lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15.5" r="1.2"/>
        </svg>
      </div>
      <div class="private-post-main">
        <div class="private-post-title">${escapeHTML(p.title)}</div>
        <div class="private-post-meta">
          <span class="cat">${escapeHTML(p.category)}</span>
          <span>${escapeHTML(p.time)}</span>
          <span class="replies">${p.floors.length - 1} 回复</span>
        </div>
      </div>
      <div class="private-post-arrow">›</div>
    </article>
  `).join('');
}

/* ================= 渲染私密帖详情 ================= */
function renderDetail(pid){
  const p = privatePosts.find(x => x.id === pid);
  if (!p) return;

  const choiceHTML = p.showChoiceBtn
    ? `
      <div class="private-choice-wrap">
        <button class="choice-btn" id="choiceBtn">是时候做出选择了</button>
        <div class="choice-hint">— 请谨慎选择 —</div>
      </div>
    `
    : '';

  detailContent.innerHTML = `
    <div class="detail-head">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="dh-main">
        <h1 class="detail-title">${escapeHTML(p.title)}</h1>
        <div class="post-meta">
          <span class="cat">${escapeHTML(p.category)}</span>
          <span>楼主：${escapeHTML(p.author)}</span>
          <span>${escapeHTML(p.time)}</span>
        </div>
      </div>
    </div>
    ${renderFloors(p)}
    <div class="detail-foot">
      <span><b>${p.floors.length}</b> 层回复</span>
      <span>仅自己可见</span>
    </div>
    ${choiceHTML}
  `;

  listView.style.display = 'none';
  detailView.classList.add('show');
  window.scrollTo(0, 0);

  const choiceBtn = document.getElementById('choiceBtn');
  if (choiceBtn){
    choiceBtn.addEventListener('click', () => {
      window.location.href = 'https://qsszzssj.pages.dev/choose.html';
    });
  }
}

/* ================= 事件绑定 ================= */
privatePostsEl.addEventListener('click', e => {
  const card = e.target.closest('.private-post');
  if (!card) return;
  renderDetail(card.dataset.pid);
});

backToList.addEventListener('click', () => {
  detailView.classList.remove('show');
  listView.style.display = '';
  window.scrollTo(0, 0);
});

/* ================= 初始化 ================= */
renderList();
